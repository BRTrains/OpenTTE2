## Reference blueprint for a BRBuild vehicle definition.
## Copy this file to /src/vehicles/<Vehicle>/<Vehicle>.yaml and remove fields you do not need.
## <??> means optional; <!!> means required. Values shown here are examples/placeholders.
## Vehicle-level values are inherited by profiles and liveries where the field is supported;
## per-variant precedence is profile, then livery, then vehicle.

info:
  identifier: <!!> # Unique identifier used as a code reference
  name: <!!> # Display name in the purchase list
  sub_name: <??> # Optional subtitle shown with the name
  based_on: <??> # Real-world/source vehicle description
  operator: <??> # Operator badge source, e.g. NWR

stats:
  vehicle_type: <!!> TRAIN|TRAM|ROADVEH|SHIP|PLANE
  train_type: <!!> LOCOMOTIVE|MULTIPLE_UNIT|WAGON|COACH # Required for every current candidate
  power_type: <??> [STEAM|DIESEL|DIESEL_HYDRAULIC|DIESEL_ELECTRIC|HYDROGEN|BATTERY|GAS_TURBINE|ELECTRIC|OHLE|THIRD_RAIL|FOURTH_RAIL]
  power: <??> # Horsepower
  weight: <??> # Metric tonnes
  length: <??> # Vehicle length in eighths of a tile
  tractive_effort: <??> # Kilonewtons
  speed: <??> # Service speed in mph — the limit the vehicle normally runs to
  design_speed: <??> # Design speed in mph, only where it differs from the service speed
  capacity: <??> # Base cargo capacity; profiles may override it
  tilt: <??> # Named tilt level or numeric strength
  sound_effect: <??> # Optional sound override
  visual_effect: <??> # Optional visual-effect override
  engine_class: <??> # Optional engine classification override
  size: <??> # Relative size modifier
  num_vehicles: <??> # Number of articulated vehicles; profiles may override it

# Cargo is a scalar or list of presets/classes. A CC_ prefix forces one class rather
# than a same-named preset (for example, bulk is a preset but CC_BULK is one class).
cargo: <??> passenger|parcels|mail|containerised|bulk|tank|open_wagon|none|<NML_CLASS>
# Examples:
# cargo: passenger
# cargo: [CC_MAIL, CC_ARMOURED]
# cargo: none
non_cargo_classes: <??> [<NML_CLASS>] # Classes excluded from refitting; classes only, no presets
default_cargo_type: <??> DEFAULT_CARGO_FIRST_REFITTABLE
autorefit: <??> true|false

# These are vehicle-level fields and may also be placed at the root of a definition.
classification: <??> # Free-form categorisation string
additional_text: <??> # String or list of strings shown in the purchase list
model_life: <??> # Years; 0 means never expires
retire_early: <??> # Years before/after normal retirement
vehicle_life: <??> # Expected individual-vehicle lifetime
cargo_age_period: <??> # Cargo ageing period in ticks
loading_speed: <??> # Cargo units loaded per interval
sound_effect: <??> # Root-level sound override
visual_effect: <??> # Root-level visual-effect override
engine_class: <??> # Root-level engine classification override
size: <??> # Root-level size override
num_vehicles: <??> # Root-level articulated vehicle count override
sprite_override: <??> [<row>, ...] # Physical spritesheet row mapping
sprite_exclude: <??> [<row>, ...] # Physical spritesheet rows to exclude
special_tags: <??> [<tag>, ...] # Tags used to register badges
nml_override: <??> # Mapping of graphics callback names to hand-written NML switches

# A candidate may contain one or more profiles. Each profile needs an identifier.
profiles:
  - identifier: DEFAULT
    name: <??>
    size: <??>
    num_vehicles: <??>
    capacity: <??>
    power: <??>
    weight: <??>
    tilt: <??>
    types: <??> [TRAIN|TRAM|ROADVEH|SHIP|PLANE]
    cargo: <??> # Same syntax as the vehicle-level cargo field
    sound_effect: <??>
    visual_effect: <??>
    special_tags: <??> [<tag>, ...]
    sprite_override: <??> [<row>, ...]
    sprite_exclude: <??> [<row>, ...]
    nml_override: <??>

liveries:
  - name: Default
    profiles: <??> [DEFAULT]
    size: <??>
    num_vehicles: <??>
    power: <??>
    weight: <??>
    tilt: <??>
    sound_effect: <??>
    visual_effect: <??>
    special_tags: <??> [<tag>, ...]
    sprite_override: <??> [<row>, ...]
    sprite_exclude: <??> [<row>, ...]
    nml_override: <??>
