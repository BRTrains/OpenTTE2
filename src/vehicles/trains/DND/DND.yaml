info:
  identifier: DND # Unique indentifier for the class, used as a code reference
  name: Donald and Douglas the Scottish twins

stats:
  vehicle_type: TRAIN
  train_type: LOCOMOTIVE
  power_type: STEAM
  power: 1000
  tractive_effort: 89.7
  weight: 45.65
  speed: 60
  num_vehicles: 2

# The sheet draws the twins' locomotives first (y=13, y=33) and their tenders after (y=53,
# y=69, y=85), so the default pair would give this single-livery unit two locomotives.
sprite_override: [1, 3]

cargo: none
dates:
  introduction_date: 1


liveries:
  - name: Black
  - name: Black with nameplates
    sprite_override: [2, 3]
    sprite_group: SPRITESHEET
  - name: Black, donald
    sprite_override: [2, 4]
    sprite_group: SPRITESHEET
  - name: Black, Douglas
    sprite_override: [2, 5]
    sprite_group: SPRITESHEET

additional_text:
  - Based on Caledonian Railway Class 812 # This is canon for the OpenTTE newGRF, and no argument will be taken

special_tags:
  - operator/NWR
  - whyte/0-6-0 # Optional for trains with a known Whyte notation (eg "whyte/0-6-0T" for Thomas)
  - NWR/9,10 # Optional for trains with a known number (eg "number/1" for Thomas)
  - BR/57646,57647
