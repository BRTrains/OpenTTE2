info:
  identifier: henry # Unique indentifier for the class, used as a code reference
  name: Henry the Green Engine

stats:
  vehicle_type: TRAIN
  train_type: LOCOMOTIVE
  power_type: STEAM
  power: 1500 # 1000 for the old shape
  tractive_effort: 113.2
  weight: 84
  speed: 80
  num_vehicles: 2

cargo: none
dates:
  introduction_date: 1

# The sheet draws one locomotive and its tender, and every shape is that same drawing, so the
# shapes are liveries of one formation: the three later ones reuse the first's rows (a livery's
# `sprite_group` names the livery it copies). The two old-shape liveries carry the lower power
# the rebuild replaced.
liveries:
  - name: Old Shape, Pacific, Green
    power: 1000
  - name: Old Shape, Green
    power: 1000
    sprite_group: Old Shape, Pacific, Green
  - name: New shape, Green
    sprite_group: Old Shape, Pacific, Green
  - name: Third shape, Green
    sprite_group: Old Shape, Pacific, Green

additional_text:
  - Based on rejected GNR A1 pacific plans
  - later rebuilt as LMS Stanier Class 5 "Black Five" 4-6-0

special_tags:
  - operator/NWR
  - NWR/3 # Optional for trains with a known number (eg "number/1" for Thomas)
  - whyte/4-6-0 # he is a 4-6-2 for the pacific old shape version Optional for trains with a known Whyte notation (eg "whyte/0-6-0T" for Thomas)
